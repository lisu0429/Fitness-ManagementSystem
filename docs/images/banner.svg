<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="FitHub 健身管理系统">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="55%" stop-color="#111936"/>
      <stop offset="100%" stop-color="#1B1230"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF8A3D"/>
      <stop offset="100%" stop-color="#FF4D6D"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7C8DB5" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <circle cx="1075" cy="120" r="210" fill="url(#glow)"/>

  <!-- decorative rings -->
  <g fill="none" stroke="#8FA2CC" stroke-opacity="0.20">
    <circle cx="1085" cy="150" r="150" stroke-width="1.2"/>
    <circle cx="1085" cy="150" r="105" stroke-width="1.2"/>
    <circle cx="1085" cy="150" r="60" stroke-width="1.2"/>
  </g>
  <g stroke="#38BDF8" stroke-width="6" stroke-linecap="round" opacity="0.9">
    <path d="M1010 150h150"/>
  </g>
  <g fill="url(#cyan)" opacity="0.95">
    <rect x="1002" y="118" width="16" height="64" rx="8"/>
    <rect x="1152" y="118" width="16" height="64" rx="8"/>
    <rect x="972" y="132" width="14" height="36" rx="7" opacity="0.75"/>
    <rect x="1184" y="132" width="14" height="36" rx="7" opacity="0.75"/>
  </g>

  <!-- mark -->
  <g transform="translate(72 76)">
    <rect width="64" height="64" rx="18" fill="url(#accent)"/>
    <path d="M20 40l10-16 7 11 7-7 8 12" fill="none" stroke="#fff" stroke-width="4.5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="160" y="126" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif"
        font-size="52" font-weight="700" fill="#F4F7FF" letter-spacing="0.5">FitHub</text>
  <text x="366" y="126" font-family="'Microsoft YaHei','PingFang SC',sans-serif"
        font-size="26" font-weight="500" fill="#9FB0D0">健身管理系统</text>

  <text x="160" y="176" font-family="'Microsoft YaHei','PingFang SC',sans-serif"
        font-size="20" fill="#C7D3EA">C 端 + B 端一体化 · 1,324 个动作库 · AI 健身教练 · 训练计划与饮食原理</text>

  <g font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="15">
    <rect x="160" y="212" width="150" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.06"
          stroke="#8FA2CC" stroke-opacity="0.28"/>
    <text x="235" y="234" fill="#DCE6F8" text-anchor="middle">FastAPI + MySQL</text>

    <rect x="322" y="212" width="150" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.06"
          stroke="#8FA2CC" stroke-opacity="0.28"/>
    <text x="397" y="234" fill="#DCE6F8" text-anchor="middle">Chroma 向量检索</text>

    <rect x="484" y="212" width="150" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.06"
          stroke="#8FA2CC" stroke-opacity="0.28"/>
    <text x="559" y="234" fill="#DCE6F8" text-anchor="middle">SSE 流式对话</text>

    <rect x="646" y="212" width="166" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.06"
          stroke="#8FA2CC" stroke-opacity="0.28"/>
    <text x="729" y="234" fill="#DCE6F8" text-anchor="middle">两级 B 端权限</text>
  </g>

  <text x="72" y="286" font-family="'Segoe UI',sans-serif" font-size="14" fill="#6F82A8">
    Single port · No build step on the frontend · Windows-friendly local setup
  </text>
</svg>
